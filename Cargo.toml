[package]
name = "composio-sdk"
version = "0.1.0"
edition = "2021"
authors = ["ZeroClaw Contributors"]
description = "Minimal Rust SDK for Composio Tool Router REST API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/composio/composio-rust-sdk"
keywords = ["composio", "api", "sdk", "tool-router", "ai"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-retry = "0.3"
thiserror = "1.0"

[dev-dependencies]
wiremock = "0.5"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "sdk_benchmarks"
harness = false
